name: Deploy history-timeline stack to Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend:
    name: Deploy Worker API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Verify Worker build
        working-directory: backend
        run: npm run build

      - name: Sync Worker DB token secret
        working-directory: backend
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TIMELINE_DB_TOKEN: ${{ secrets.TIMELINE_DB_TOKEN }}
        run: |
          if [ -z "$TIMELINE_DB_TOKEN" ]; then
            echo "TIMELINE_DB_TOKEN not set. Skip sync and deploy without DB token (DB APIs will fail)."
            echo "HAS_TIMELINE_DB_TOKEN=false" >> "$GITHUB_ENV"
            echo "DB_TOKEN_FALLBACK=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CF_API_TOKEN" ]; then
            echo "No Cloudflare token set. Skip sync."
            echo "HAS_TIMELINE_DB_TOKEN=true" >> "$GITHUB_ENV"
            echo "DB_TOKEN_FALLBACK=true" >> "$GITHUB_ENV"
            exit 0
          fi

          sync_ok=0
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            if printf '%s' "$TIMELINE_DB_TOKEN" | CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" npx wrangler secret put TIMELINE_DB_TOKEN; then
              sync_ok=1
            else
              echo "CLOUDFLARE_API_TOKEN failed. Will try CF_API_TOKEN if different."
            fi
          fi

          if [ "$sync_ok" -eq 0 ] && [ -n "$CF_API_TOKEN" ]; then
            if [ "$CLOUDFLARE_API_TOKEN" != "$CF_API_TOKEN" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              if printf '%s' "$TIMELINE_DB_TOKEN" | CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" npx wrangler secret put TIMELINE_DB_TOKEN; then
                sync_ok=1
              else
                echo "CF_API_TOKEN also failed."
              fi
            fi
          fi

          echo "HAS_TIMELINE_DB_TOKEN=true" >> "$GITHUB_ENV"
          if [ "$sync_ok" -eq 1 ]; then
            echo "DB_TOKEN_FALLBACK=false" >> "$GITHUB_ENV"
          else
            echo "DB_TOKEN_FALLBACK=true" >> "$GITHUB_ENV"
          fi

      - name: Deploy Cloudflare Worker
        working-directory: backend
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          TIMELINE_DB_TOKEN: ${{ secrets.TIMELINE_DB_TOKEN }}
        run: |
          if [ "${HAS_TIMELINE_DB_TOKEN:-false}" != "true" ]; then
            echo "TIMELINE_DB_TOKEN is missing. Deploy without token binding."
            npx wrangler deploy
          elif [ "${DB_TOKEN_FALLBACK:-false}" = "true" ]; then
            echo "Secret sync failed. Deploying with --var fallback (non-secret)."
            npx wrangler deploy --var "TIMELINE_DB_TOKEN:${TIMELINE_DB_TOKEN}"
          else
            npx wrangler deploy
          fi

      - name: Verify Worker health and list API
        if: ${{ vars.DEPLOY_API_BASE != '' }}
        run: |
          echo "Checking worker health: ${{ vars.DEPLOY_API_BASE }}/api/health"
          curl -fsSL --max-time 30 "${{ vars.DEPLOY_API_BASE }}/api/health"

          echo "Checking episodes API: ${{ vars.DEPLOY_API_BASE }}/api/episodes?limit=1&sort=asc"
          curl -fsSL --max-time 30 "${{ vars.DEPLOY_API_BASE }}/api/episodes?limit=1&sort=asc"

          echo "Checking facts API: ${{ vars.DEPLOY_API_BASE }}/api/facts?limit=1&sort=asc"
          curl -fsSL --max-time 30 "${{ vars.DEPLOY_API_BASE }}/api/facts?limit=1&sort=asc"
  frontend:
    name: Deploy Frontend Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.DEPLOY_API_BASE }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ vars.CF_PAGES_PROJECT }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

      - name: Verify frontend site
        if: ${{ vars.CF_PAGES_PROJECT != '' }}
        run: |
          echo "Checking Pages site: https://${{ vars.CF_PAGES_PROJECT }}.pages.dev"
          curl -fsSL --max-time 30 "https://${{ vars.CF_PAGES_PROJECT }}.pages.dev"
